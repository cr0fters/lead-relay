name: CI/CD

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore LeadRelay.sln

      - name: Test
        run: dotnet test LeadRelay.sln --configuration Release --no-restore

  deploy_production:
    name: Deploy Production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Validate Railway secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] && [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::Missing Railway auth secret. Set one of: RAILWAY_TOKEN or RAILWAY_API_TOKEN"
            exit 1
          fi
          if [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "::error::Missing production environment secret: RAILWAY_PROJECT_ID"
            exit 1
          fi
          if [ -z "$RAILWAY_ENVIRONMENT" ]; then
            echo "::error::Missing production environment secret: RAILWAY_ENVIRONMENT"
            exit 1
          fi
          if [ -z "$RAILWAY_SERVICE" ]; then
            echo "::error::Missing production environment secret: RAILWAY_SERVICE"
            exit 1
          fi

          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "Using RAILWAY_TOKEN (length: ${#RAILWAY_TOKEN})"
          else
            echo "Using RAILWAY_API_TOKEN (length: ${#RAILWAY_API_TOKEN})"
          fi
          echo "RAILWAY_PROJECT_ID: $RAILWAY_PROJECT_ID"
          echo "RAILWAY_ENVIRONMENT: $RAILWAY_ENVIRONMENT"
          echo "RAILWAY_SERVICE: $RAILWAY_SERVICE"

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] && [ -n "$RAILWAY_API_TOKEN" ]; then
            export RAILWAY_TOKEN="$RAILWAY_API_TOKEN"
          fi
          railway up --ci \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_SERVICE"
